<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calendar — Anime Con GIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css" />
<style>
  .cal-shell { max-width: 1240px; margin: 0 auto; padding: 24px 22px 40px; }
  .cal-toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .cal-toolbar h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .cal-toolbar h1 span { color: var(--text-2); font-weight: 600; }
  .tb-nav { display: flex; gap: 6px; align-items: center; }
  .tb-nav button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text-0); font-size: 15px; }
  .tb-nav button:hover { background: rgba(168,85,247,0.2); }
  .tb-today { padding: 8px 15px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-0); font-weight: 700; font-size: 13px; }
  .view-switch { margin-left: auto; display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .view-switch button { padding: 7px 16px; border-radius: 8px; border: 0; background: transparent; color: var(--text-1); font-weight: 700; font-size: 13px; }
  .view-switch button.on { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; }

  /* calendar grid */
  .cal { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg-1); }
  .cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); }
  .cal-dow div { padding: 11px 12px; font-size: 12px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.05em; }
  .cal-body { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(118px, 1fr); }
  .cell { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 8px; position: relative; transition: background .15s; }
  .cell:nth-child(7n) { border-right: 0; }
  .cell:hover { background: rgba(168,85,247,0.06); }
  .cell.dim { background: rgba(0,0,0,0.18); }
  .cell.dim .num { color: var(--text-2); opacity: 0.45; }
  .num { font-size: 13px; font-weight: 700; color: var(--text-1); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
  .cell.today .num { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; }
  .weekend .num { color: var(--text-2); }

  .ev {
    display: block; margin-top: 5px; padding: 4px 8px; border-radius: 7px;
    font-size: 11.5px; font-weight: 700; color: #fff; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    border-left: 3px solid rgba(255,255,255,0.55);
  }
  .ev.helsinki { background: linear-gradient(90deg, rgba(255,74,141,0.85), rgba(255,74,141,0.5)); }
  .ev.vantaa { background: linear-gradient(90deg, rgba(251,191,36,0.85), rgba(251,191,36,0.45)); color: #1a1340; }
  .ev.espoo { background: linear-gradient(90deg, rgba(34,211,238,0.8), rgba(34,211,238,0.45)); color: #07223a; }
  .ev .dot { display:inline-block; width:6px;height:6px;border-radius:50%;background:#fff;margin-right:5px;vertical-align:middle; }
  .ev-more { margin-top: 4px; font-size: 11px; color: var(--text-2); font-weight: 600; padding-left: 4px; }

  /* legend / sidebar mini */
  .cal-foot { display: flex; gap: 18px; margin-top: 18px; flex-wrap: wrap; align-items: center; }
  .lg { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-1); }
  .lg .sw { width: 13px; height: 13px; border-radius: 4px; }

  @media (max-width: 720px) {
    .cal-body { grid-auto-rows: minmax(80px, 1fr); }
    .ev { font-size: 10px; padding: 3px 5px; }
    .nav-links a:not(.active) { display: none; }
  }
</style>
</head>
<body>
<div class="mock-banner">◆ STATIC DESIGN MOCKUP — FULL CALENDAR · 3 of 5 ◆</div>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-logo">⛩️</span>
      <span class="brand-text">AnimeCon GIS<small>Helsinki · Vantaa</small></span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="map.html">Map</a>
      <a href="calendar.html" class="active">Calendar</a>
      <a href="events.html">Events</a>
      <a href="about.html">About</a>
      <a href="donate.html">Donate</a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle light/dark mode"><span class="moon">🌙</span><span class="sun">☀️</span></button>
    </div>
  </div>
</nav>

<div class="cal-shell">
  <div class="cal-toolbar">
    <div class="tb-nav">
      <button>‹</button>
      <button class="tb-today">Today</button>
      <button>›</button>
    </div>
    <h1>July <span>2026</span></h1>
    <div class="view-switch">
      <button>Day</button>
      <button>Week</button>
      <button class="on">Month</button>
    </div>
  </div>

  <div class="cal">
    <div class="cal-dow">
      <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
    </div>
    <div class="cal-body" id="calBody"></div>
  </div>

  <div class="cal-foot">
    <div class="lg"><span class="sw" style="background:var(--pink)"></span> Helsinki</div>
    <div class="lg"><span class="sw" style="background:var(--gold)"></span> Vantaa</div>
    <div class="lg"><span class="sw" style="background:var(--cyan)"></span> Espoo</div>
    <div class="lg" style="margin-left:auto;color:var(--text-2)">Click an event to open it on the map →</div>
  </div>
</div>

<script>
  // July 2026 starts Wednesday (Mon-indexed col 2). 31 days.
  const firstDow = 2, days = 31, prevTail = 30, today = 27;
  const events = {
    11: [{ t: 'Tracon Hel', c: 'helsinki' }],
    12: [{ t: 'Tracon Hel', c: 'helsinki' }],
    13: [{ t: 'Tracon Hel', c: 'helsinki' }],
    5:  [{ t: 'Cosplay meetup', c: 'espoo' }],
    19: [{ t: 'Artist alley pop-up', c: 'vantaa' }],
    26: [{ t: 'Figure swap market', c: 'helsinki' }, { t: 'Karaoke night', c: 'vantaa' }],
  };
  const body = document.getElementById('calBody');
  // leading days from previous month
  for (let i = 0; i < firstDow; i++) {
    const d = prevTail - firstDow + 1 + i;
    body.insertAdjacentHTML('beforeend', `<div class="cell dim"><div class="num">${d}</div></div>`);
  }
  for (let d = 1; d <= days; d++) {
    const col = (firstDow + d - 1) % 7;
    const weekend = col >= 5 ? 'weekend' : '';
    const todayCls = d === today ? 'today' : '';
    let evHtml = '';
    if (events[d]) {
      const list = events[d];
      list.slice(0, 2).forEach(e => evHtml += `<span class="ev ${e.c}"><span class="dot"></span>${e.t}</span>`);
      if (list.length > 2) evHtml += `<div class="ev-more">+${list.length - 2} more</div>`;
    }
    body.insertAdjacentHTML('beforeend',
      `<div class="cell ${weekend} ${todayCls}"><div class="num">${d}</div>${evHtml}</div>`);
  }
  // trailing to fill last row
  const total = firstDow + days;
  const trail = (7 - (total % 7)) % 7;
  for (let i = 1; i <= trail; i++) {
    body.insertAdjacentHTML('beforeend', `<div class="cell dim"><div class="num">${i}</div></div>`);
  }
</script>
</body>
</html>
