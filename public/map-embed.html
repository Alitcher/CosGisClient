<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Map</title>
<link href="/maplibre/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #e8e6f0; font-family: Inter, sans-serif; }
  #map { position: absolute; inset: 0; }
  .mk { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; cursor: pointer;
        box-shadow: 0 3px 8px rgba(0,0,0,.4); }
  .mk.spot { border-radius: 6px; }
  .maplibregl-popup-content { padding: 0; border-radius: 14px; overflow: hidden;
        box-shadow: 0 10px 28px rgba(0,0,0,.28); border: 2px solid rgba(124,58,173,.25); }
  .card { width: 250px; font-family: Inter, sans-serif; color: #2a1840; background: #fff; }
  .card .meta + .meta { margin-top: 2px; }
  .card img { width: 100%; height: 110px; object-fit: cover; display: block; background: #eee; }
  .card .body { padding: 10px 12px 12px; }
  .card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .card .tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em;
        color: #7c3aad; background: #f0e7fb; border: 1.5px solid #d9c4f5; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .card .meta { font-size: 12px; color: #6b5b86; margin-top: 4px; }
  .card p { margin: 6px 0 0; font-size: 12px; color: #6b5b86; }
  .card .themes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .card .themes span { font-size: 10px; font-weight: 700; color: #5b4779; background: #f3eefb;
        border: 1.5px solid #e3d6f6; padding: 2px 7px; border-radius: 999px; }
  .card .date { font-size: 12px; font-weight: 700; color: #be185d; }
  /* custom rotation compass */
  .compass { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .compass .rose { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #d9c4f5;
        background: #fff; cursor: pointer; padding: 0; display: grid; place-items: center;
        box-shadow: 0 3px 8px rgba(0,0,0,.22); transition: opacity .15s, box-shadow .15s; }
  .compass .rose:hover { box-shadow: 0 4px 12px rgba(124,58,173,.35); }
  .compass .needle { transform-origin: 50% 50%; transition: transform .12s ease-out; }
  .compass .deg { font: 800 11px Inter, sans-serif; color: #5b4779; background: #fff;
        border: 1.5px solid #e3d6f6; border-radius: 999px; padding: 1px 8px; min-width: 26px;
        text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.16); }
</style>
</head>
<body>
<div id="map"></div>
<script src="/maplibre/maplibre-gl.js"></script>
<script>
  var CITY_COLOR = { Helsinki: '#ff4f96', Vantaa: '#ffc93c', Espoo: '#2dd4bf' };
  var TYPE_LABEL = { cafe: 'Café', restaurant: 'Restaurant', mall: 'Mall', studio: 'Studio', outdoor: 'Outdoor' };
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDate(iso) { var p = (iso || '').split('-'); if (p.length < 3) return iso || ''; return p[2] + ' ' + (MON[(+p[1]) - 1] || '') + ' ' + p[0]; }
  // Escape user-submitted text so a name/description with < > & " can't break the card.
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // Precise location line — events have no street address, only a venue + coordinates.
  function fmtCoord(lat, lng) { return (typeof lat === 'number' && typeof lng === 'number') ? lat.toFixed(4) + ', ' + lng.toFixed(4) : ''; }
  function row(icon, text) { return text ? '<div class="meta">' + icon + ' ' + esc(text) + '</div>' : ''; }

  // cosplay-friendly places (static)
  var places = [
    { id:'p1', name:'Café Sakura', type:'cafe', city:'Helsinki', address:'Iso Roobertinkatu 12, Helsinki', lng:24.9402, lat:60.1641, themes:['pastel','japanese garden','kawaii'], desc:'Cosy pastel café that welcomes cosplayers for photos.', photo:'https://picsum.photos/seed/sakura/600/400' },
    { id:'p2', name:'Neon Ramen Bar', type:'restaurant', city:'Helsinki', address:'Kaisaniemenkatu 4, Helsinki', lng:24.9465, lat:60.1718, themes:['cyberpunk','neon','night city'], desc:'Neon-lit ramen spot with a cyberpunk vibe.', photo:'https://picsum.photos/seed/ramen/600/400' },
    { id:'p3', name:'Kamppi Center', type:'mall', city:'Helsinki', address:'Urho Kekkosen katu 1, Helsinki', lng:24.9316, lat:60.1686, themes:['modern','indoor backdrops'], desc:'Spacious indoor mall with bright atriums.', photo:'https://picsum.photos/seed/kamppi/600/400' },
    { id:'p4', name:'Studio Hikari', type:'studio', city:'Vantaa', address:'Tikkurila, Vantaa', lng:25.0432, lat:60.2925, themes:['chroma key','fantasy sets','studio lighting'], desc:'Bookable photo studio with cosplay-friendly sets.', photo:'https://picsum.photos/seed/hikari/600/400' },
    { id:'p5', name:'Töölönlahti Park', type:'outdoor', city:'Helsinki', address:'Töölönlahti, Helsinki', lng:24.9356, lat:60.1798, themes:['nature','lakeside','spring blossoms'], desc:'Scenic lakeside park popular for outdoor shoots.', photo:'https://picsum.photos/seed/toolo/600/400' },
    { id:'p6', name:'Maid Café Mochi', type:'cafe', city:'Espoo', address:'Leppävaara, Espoo', lng:24.8138, lat:60.2192, themes:['maid cafe','kawaii','tea party'], desc:'Themed maid café that loves hosting cosplayers.', photo:'https://picsum.photos/seed/mochi/600/400' }
  ];
  // default conventions (replaced by setEvents from the app/admin store)
  var defaultEvents = [
    { id:'e1', name:'Tracon Hel', venue:'Messukeskus', city:'Helsinki', lng:24.9354, lat:60.2012, date:'2026-07-11' },
    { id:'e2', name:'Yukicon Summer', venue:'Vantaa Energia Areena', city:'Vantaa', lng:25.0116, lat:60.2931, date:'2026-08-23' },
    { id:'e3', name:'Tsukicon Mini', venue:'Kaapelitehdas', city:'Helsinki', lng:24.9043, lat:60.1640, date:'2026-09-14' },
    { id:'e4', name:'Cosvision', venue:'Dipoli', city:'Espoo', lng:24.8270, lat:60.1849, date:'2026-10-04' }
  ];

  function spotCard(p) {
    var photo = p.photo || (p.photos && p.photos[0] && p.photos[0].url) || '';
    var desc = p.desc || p.description || '';
    var hours = p.openingHours || p.opening_hours || '';
    // Show the street address if we have one; append the city unless it's already in there.
    var addr = p.address || '';
    var loc = addr ? (addr + (p.city && addr.indexOf(p.city) < 0 ? ', ' + p.city : '')) : (p.city || '');
    return '<div class="card">' + (photo ? '<img src="' + esc(photo) + '" alt=""/>' : '') + '<div class="body">' +
      '<div class="top"><h3>' + esc(p.name) + '</h3><span class="tag">' + esc(TYPE_LABEL[p.type] || p.type) + '</span></div>' +
      row('📍', loc) +
      row('🕐', hours) +
      row('🧭', fmtCoord(p.lat, p.lng)) +
      (desc ? '<p>' + esc(desc) + '</p>' : '') +
      '<div class="themes">' + (p.themes || []).map(function (t) { return '<span>#' + esc(t) + '</span>'; }).join('') + '</div>' +
      '</div></div>';
  }
  function eventCard(e) {
    var color = CITY_COLOR[e.city] || '#ff4f96';
    var desc = e.description || e.desc || '';
    return '<div class="card"><div class="body">' +
      '<div class="top"><h3>' + esc(e.name) + '</h3><span class="tag" style="color:' + color + ';border-color:' + color + '">' + esc(e.city) + '</span></div>' +
      '<div class="date" style="margin-top:6px;">🎌 ' + esc(fmtDate(e.date)) + '</div>' +
      row('📍', e.venue ? (e.venue + (e.city ? ', ' + e.city : '')) : '') +
      row('🧭', fmtCoord(e.lat, e.lng)) +
      (desc ? '<p>' + esc(desc) + '</p>' : '') +
      '</div></div>';
  }

  var map = new maplibregl.Map({ container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty', center: [24.945, 60.2], zoom: 10.5 });
  // Keep the zoom buttons but drop the stock compass — we add our own below.
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }));

  // --- custom compass: needle points to true north as you rotate, the pill shows how
  // many degrees you've turned from the default (north-up), and clicking it resets. ---
  var compassNeedle, compassDeg, compassBtn;
  var CompassControl = {
    onAdd: function (m) {
      this._map = m;
      var c = document.createElement('div');
      c.className = 'maplibregl-ctrl compass';
      c.innerHTML =
        '<button class="rose" type="button" aria-label="Reset bearing to north">' +
          '<svg class="needle" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">' +
            '<polygon points="12,2 7.5,13 12,10.5 16.5,13" fill="#e5484d"></polygon>' +   /* N half (red) */
            '<polygon points="12,22 7.5,11 12,13.5 16.5,11" fill="#9aa0b4"></polygon>' +  /* S half (grey) */
          '</svg>' +
        '</button>' +
        '<div class="deg">0°</div>';
      compassBtn = c.querySelector('.rose');
      compassNeedle = c.querySelector('.needle');
      compassDeg = c.querySelector('.deg');
      // Click = ease back to the default orientation (north up, no pitch).
      compassBtn.addEventListener('click', function () { m.easeTo({ bearing: 0, pitch: 0, duration: 500 }); });
      this._el = c;
      return c;
    },
    onRemove: function () { if (this._el && this._el.parentNode) this._el.parentNode.removeChild(this._el); this._map = undefined; }
  };
  function updateCompass() {
    if (!compassNeedle) return;
    var b = map.getBearing();                       // -180..180 (0 = north up = default)
    compassNeedle.style.transform = 'rotate(' + (-b) + 'deg)'; // keep the red arrow on true north
    var heading = (Math.round(b) + 360) % 360;      // 0..359
    var diff = Math.min(heading, 360 - heading);    // shortest turn from default, 0..180
    compassDeg.textContent = diff + '°';
    compassBtn.title = diff === 0
      ? 'Facing north (default)'
      : 'Rotated ' + diff + '° from north — click to reset';
    compassBtn.style.opacity = diff === 0 ? '.7' : '1';
  }
  map.addControl(CompassControl, 'top-right');
  map.on('rotate', updateCompass);
  map.on('pitch', updateCompass);

  var CARD_ZOOM = 14;
  var entries = [];          // { kind, city, marker, popup, el, visible }
  var currentCity = 'all';

  function addMarker(kind, item, color, html) {
    var el = document.createElement('div');
    el.className = 'mk' + (kind === 'spot' ? ' spot' : '');
    el.style.background = color;
    var popup = new maplibregl.Popup({ offset: 16, closeButton: true, closeOnClick: false, maxWidth: '280px' }).setHTML(html);
    var marker = new maplibregl.Marker({ element: el }).setLngLat([item.lng, item.lat]).setPopup(popup).addTo(map);
    var entry = { kind: kind, city: item.city, marker: marker, popup: popup, el: el, visible: true };
    el.addEventListener('click', function () { marker.togglePopup(); });
    applyVisibility(entry);
    entries.push(entry);
    return entry;
  }

  function applyVisibility(e) {
    e.visible = (currentCity === 'all' || e.city === currentCity);
    e.el.style.display = e.visible ? '' : 'none';
    if (!e.visible && e.popup.isOpen()) e.marker.togglePopup();
  }

  function buildEvents(list) {
    entries = entries.filter(function (e) {
      if (e.kind === 'con') { e.marker.remove(); return false; }
      return true;
    });
    list.forEach(function (e) { addMarker('con', e, CITY_COLOR[e.city] || '#ff4f96', eventCard(e)); });
    updateCards();
  }
  function buildPlaces(list) {
    entries = entries.filter(function (e) {
      if (e.kind === 'spot') { e.marker.remove(); return false; }
      return true;
    });
    list.forEach(function (p) { addMarker('spot', p, '#8b5cf6', spotCard(p)); });
    updateCards();
  }

  function updateCards() {
    var z = map.getZoom();
    var bounds = map.getBounds();
    entries.forEach(function (e) {
      var open = e.popup.isOpen();
      var shouldOpen = e.visible && z >= CARD_ZOOM && bounds.contains(e.marker.getLngLat());
      if (shouldOpen && !open) e.marker.togglePopup();
      else if (!shouldOpen && open) e.marker.togglePopup();
    });
  }
  map.on('moveend', updateCards);
  map.on('zoomend', updateCards);

  map.on('load', function () {
    buildPlaces(places);
    buildEvents(defaultEvents);
    updateCompass();
    parent.postMessage({ type: 'mapReady' }, '*');
  });

  // ---- message API driven by the app ----
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type === 'filterCity') {
      currentCity = d.city || 'all';
      entries.forEach(applyVisibility);   // filters BOTH spots and conventions
      updateCards();
    } else if (d.type === 'setEvents' && Array.isArray(d.events)) {
      buildEvents(d.events);
    } else if (d.type === 'setPlaces' && Array.isArray(d.places)) {
      buildPlaces(d.places);
    } else if (d.type === 'focus') {
      map.flyTo({ center: [d.lng, d.lat], zoom: 15.5, speed: 1.2 });
    }
  });
</script>
</body>
</html>
