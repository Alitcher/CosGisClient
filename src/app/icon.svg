<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Reindeer mascot, front view (face based on the chibi reindeer reference). -->
  <!-- antlers: tan with a darker edge -->
  <g fill="none" stroke="#a58022" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"><path d="M196 180 C182 132 160 104 128 72 M168 126 L116 124 M182 150 C158 160 126 166 104 154"/><path d="M316 180 C330 132 352 104 384 72 M344 126 L396 124 M330 150 C354 160 386 166 408 154"/></g>
  <g fill="none" stroke="#d9b46c" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"><path d="M196 180 C182 132 160 104 128 72 M168 126 L116 124 M182 150 C158 160 126 166 104 154"/><path d="M316 180 C330 132 352 104 384 72 M344 126 L396 124 M330 150 C354 160 386 166 408 154"/></g>
  <!-- ears: big, pointing out and up, pink inside -->
  <ellipse cx="104" cy="212" rx="68" ry="33" transform="rotate(-28 104 212)" fill="#ffffff" stroke="#6b4f3a" stroke-width="6"/>
  <ellipse cx="408" cy="212" rx="68" ry="33" transform="rotate(28 408 212)" fill="#ffffff" stroke="#6b4f3a" stroke-width="6"/>
  <ellipse cx="98" cy="212" rx="44" ry="18" transform="rotate(-28 98 212)" fill="#f6b5c1"/>
  <ellipse cx="414" cy="212" rx="44" ry="18" transform="rotate(28 414 212)" fill="#f6b5c1"/>
  <!-- head: wide at the top, tapering to a rounded chin -->
  <path d="M256 168 C340 168 394 214 392 284 C390 350 330 442 256 442 C182 442 122 350 120 284 C118 214 172 168 256 168 Z" fill="#ffffff" stroke="#6b4f3a" stroke-width="6"/>
  <ellipse cx="256" cy="366" rx="62" ry="44" fill="#f7e9df"/>
  <!-- brows -->
  <path d="M184 254 Q196 249 208 253 M304 253 Q316 249 328 254" fill="none" stroke="#c9a48a" stroke-width="5" stroke-linecap="round"/>
  <!-- eyes: brown, with lashes and highlights -->
  <ellipse cx="198" cy="296" rx="17" ry="21" fill="#5b3a2b"/>
  <ellipse cx="314" cy="296" rx="17" ry="21" fill="#5b3a2b"/>
  <circle cx="198" cy="298" r="9" fill="#2e1c16"/>
  <circle cx="314" cy="298" r="9" fill="#2e1c16"/>
  <circle cx="204" cy="288" r="6" fill="#ffffff"/>
  <circle cx="320" cy="288" r="6" fill="#ffffff"/>
  <circle cx="192" cy="306" r="3" fill="#ffffff"/>
  <circle cx="308" cy="306" r="3" fill="#ffffff"/>
  <path d="M178 286 Q198 266 220 282 M178 286 L168 280 M334 286 Q314 266 292 282 M334 286 L344 280" fill="none" stroke="#2e1c16" stroke-width="6" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="166" cy="334" rx="22" ry="12" fill="#f4a3b4" opacity="0.6"/>
  <ellipse cx="346" cy="334" rx="22" ry="12" fill="#f4a3b4" opacity="0.6"/>
  <!-- nose + mouth -->
  <path d="M240 338 Q256 331 272 338 Q268 352 256 357 Q244 352 240 338 Z" fill="#3b2620"/>
  <ellipse cx="251" cy="340" rx="5" ry="3" fill="#ffffff" opacity="0.6"/>
  <path d="M256 357 L256 368 M240 368 Q248 378 256 368 Q264 378 272 368" fill="none" stroke="#3b2620" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- snowflake hair clip: light blue with a darker edge -->
  <g transform="translate(338 200)" fill="none" stroke="#2baad4" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path transform="rotate(0)" d="M0 0 L0 -30 M0 -18 L-9 -26 M0 -18 L9 -26"/><path transform="rotate(60)" d="M0 0 L0 -30 M0 -18 L-9 -26 M0 -18 L9 -26"/><path transform="rotate(120)" d="M0 0 L0 -30 M0 -18 L-9 -26 M0 -18 L9 -26"/><path transform="rotate(180)" d="M0 0 L0 -30 M0 -18 L-9 -26 M0 -18 L9 -26"/><path transform="rotate(240)" d="M0 0 L0 -30 M0 -18 L-9 -26 M0 -18 L9 -26"/><path transform="rotate(300)" d="M0 0 L0 -30 M0 -18 L-9 -26 M0 -18 L9 -26"/></g>
  <g transform="translate(338 200)" fill="none" stroke="#bfe8fb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path transform="rotate(0)" d="M0 0 L0 -30 M0 -18 L-9 -26 M0 -18 L9 -26"/><path transform="rotate(60)" d="M0 0 L0 -30 M0 -18 L-9 -26 M0 -18 L9 -26"/><path transform="rotate(120)" d="M0 0 L0 -30 M0 -18 L-9 -26 M0 -18 L9 -26"/><path transform="rotate(180)" d="M0 0 L0 -30 M0 -18 L-9 -26 M0 -18 L9 -26"/><path transform="rotate(240)" d="M0 0 L0 -30 M0 -18 L-9 -26 M0 -18 L9 -26"/><path transform="rotate(300)" d="M0 0 L0 -30 M0 -18 L-9 -26 M0 -18 L9 -26"/></g>
